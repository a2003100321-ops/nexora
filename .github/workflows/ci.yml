name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Quality, lint, and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks
        run: ./gradlew --no-daemon quality

      - name: Run app lint
        run: ./gradlew --no-daemon :app-mobile:lintDebug :app-tv:lintDebug

      - name: Assemble debug APKs
        run: ./gradlew --no-daemon :app-mobile:assembleDebug :app-tv:assembleDebug

      - name: Upload mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mobile-debug-apk
          path: app-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-tv-debug-apk
          path: app-tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
